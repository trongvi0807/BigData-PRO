<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewLens Demo mô hình</title><style>body{font:18px system-ui;max-width:850px;margin:50px auto;padding:0 24px;color:#172e43}textarea{width:100%;height:140px;padding:12px;font:inherit;box-sizing:border-box}button{background:#12636a;color:white;border:0;padding:14px 26px;font:inherit;border-radius:8px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4f5;padding:22px}a{color:#12636a}</style><a href="/">← Dashboard ReviewLens</a><h1>Phân tích một phản hồi mới</h1><p>Mô hình TF-IDF + LR/SVM được huấn luyện bằng Spark từ HDFS. Cảm xúc dự đoán ở mức toàn review, dùng số sao làm nhãn thay thế. Khía cạnh là đề cập theo luật, chưa xác thực polarity theo khía cạnh.</p><form><label for="review">Nội dung phản hồi</label><textarea id="review" maxlength="5000" required>Hàng tốt nhưng giao hàng quá chậm, ứng dụng thường xuyên bị lỗi.</textarea><button>Phân tích</button></form><pre id="result" aria-live="polite">Nhập phản hồi và bấm Phân tích.</pre><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const box=document.querySelector('#result');box.textContent='Đang phân tích...';try{const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({review:document.querySelector('#review').value})});const d=await r.json();box.textContent=JSON.stringify(d,null,2)}catch(e){box.textContent=e.message}};</script></html>
